<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucralize | Portal Contábil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Tema: aplica antes de renderizar (sem piscar). Escuro é o padrão. */
(function(){var t='dark';try{var v=localStorage.getItem('ps_theme')||localStorage.getItem('ct_theme');if(v==='light'||v==='dark')t=v;}catch(e){}
document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);})();
</script>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/lucralize/pagina-principal/main/lucralize-logo-horizontal.png">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   IDENTIDADE VISUAL LUCRALIZE — único lugar onde existem cores (hex/rgba).
   Todo o resto do CSS e do JavaScript usa var(--lz-...).
   Dois temas: Escuro (padrão, :root) e Claro ([data-theme="light"]).
   O menu lateral é azul-escuro (#11192E) nos dois temas.
   ═══════════════════════════════════════════════════════════════════════════ */
:root,
[data-theme="dark"]{
  color-scheme:dark;
  --lz-bg:#0e1428; --lz-bg-alt:#11192e; --lz-surface-2:#172039; --lz-surface-3:#1f2a47; --lz-input-bg:#0e1428;
  --lz-hover:rgba(255,255,255,.06);
  --lz-text:#ffffff; --lz-text-muted:rgba(255,255,255,.65); --lz-text-faint:rgba(255,255,255,.55);
  --lz-title:#aadbe3; --lz-title-soft:rgba(170,219,227,.12);
  --lz-border:rgba(255,255,255,.10); --lz-border-strong:rgba(255,255,255,.22);
  --lz-accent:#d52a43; --lz-accent-hover:#bf2439; --lz-accent-soft:rgba(213,42,67,.16);
  --lz-link:#ff7a8c; --lz-on-accent:#ffffff; --lz-focus:#ff7a8c;
  --lz-success-ink:#5fd3a0; --lz-success-bg:rgba(95,211,160,.12); --lz-success-bg-2:rgba(95,211,160,.18); --lz-success-line:rgba(95,211,160,.38);
  --lz-warning-ink:#ffb066; --lz-warning-bg:rgba(255,176,102,.12); --lz-warning-bg-2:rgba(255,176,102,.18); --lz-warning-line:rgba(255,176,102,.38);
  --lz-danger-ink:#ffa58a; --lz-danger-bg:rgba(255,154,122,.12); --lz-danger-bg-2:rgba(255,154,122,.18); --lz-danger-line:rgba(255,154,122,.40);
  --lz-info-ink:#aadbe3; --lz-info-bg:rgba(170,219,227,.12); --lz-info-line:rgba(170,219,227,.32);
  --lz-cat-4:#1f8a5b;
  --lz-shadow-sm:0 1px 2px rgba(0,0,0,.35); --lz-shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --lz-shadow-md:0 4px 14px rgba(0,0,0,.45); --lz-shadow-lg:0 12px 32px -8px rgba(0,0,0,.7);
  --lz-overlay:rgba(6,10,22,.72);
  --lz-side-bg:#11192e; --lz-side-text:rgba(255,255,255,.65); --lz-side-text-strong:#ffffff; --lz-side-muted:rgba(255,255,255,.55);
  --lz-side-hover:rgba(255,255,255,.06); --lz-side-active:rgba(213,42,67,.18); --lz-side-border:rgba(255,255,255,.10);
  --lz-side-control:rgba(255,255,255,.08); --lz-side-title:#aadbe3;
  --lz-code-bg:#0a0f20; --lz-code-text:#b7e35b;
  --lz-print-ink:#000000; --lz-print-paper:#ffffff; --lz-print-line:#bbbbbb; --lz-print-accent:#d52a43;
}
[data-theme="light"]{
  color-scheme:light;
  --lz-bg:#f4f6fa; --lz-bg-alt:#ffffff; --lz-surface-2:#eef1f7; --lz-surface-3:#e3e8f1; --lz-input-bg:#ffffff;
  --lz-hover:rgba(14,20,40,.045);
  --lz-text:#0e1428; --lz-text-muted:rgba(14,20,40,.65); --lz-text-faint:rgba(14,20,40,.64);
  --lz-title:#0e1428; --lz-title-soft:rgba(170,219,227,.35);
  --lz-border:rgba(14,20,40,.12); --lz-border-strong:rgba(14,20,40,.24);
  --lz-accent:#d52a43; --lz-accent-hover:#bf2439; --lz-accent-soft:rgba(213,42,67,.10);
  --lz-link:#c0243b; --lz-on-accent:#ffffff; --lz-focus:#c0243b;
  --lz-success-ink:#17734f; --lz-success-bg:#e6f5ee; --lz-success-bg-2:#d2ecdf; --lz-success-line:#b7ddc9;
  --lz-warning-ink:#8a4b00; --lz-warning-bg:#fff1d6; --lz-warning-bg-2:#fde4b3; --lz-warning-line:#f3d08e;
  --lz-danger-ink:#b3361a; --lz-danger-bg:#fdece6; --lz-danger-bg-2:#fad8cd; --lz-danger-line:#f1bcae;
  --lz-info-ink:#0b6173; --lz-info-bg:#e3f3f6; --lz-info-line:#b6dde4;
  --lz-cat-4:#1f8a5b;
  --lz-shadow-sm:0 1px 2px rgba(14,20,40,.06); --lz-shadow:0 1px 2px rgba(14,20,40,.05),0 8px 24px -12px rgba(14,20,40,.2);
  --lz-shadow-md:0 4px 14px rgba(14,20,40,.1); --lz-shadow-lg:0 12px 32px -8px rgba(14,20,40,.25);
  --lz-overlay:rgba(14,20,40,.55);
  --lz-side-bg:#11192e; --lz-side-text:rgba(255,255,255,.65); --lz-side-text-strong:#ffffff; --lz-side-muted:rgba(255,255,255,.55);
  --lz-side-hover:rgba(255,255,255,.06); --lz-side-active:rgba(213,42,67,.18); --lz-side-border:rgba(255,255,255,.10);
  --lz-side-control:rgba(255,255,255,.08); --lz-side-title:#aadbe3;
  --lz-code-bg:#0a0f20; --lz-code-text:#b7e35b;
  --lz-print-ink:#000000; --lz-print-paper:#ffffff; --lz-print-line:#bbbbbb; --lz-print-accent:#d52a43;
}
/* Nomes antigos do CSS apontando para os tokens da marca */
:root,[data-theme="dark"],[data-theme="light"]{
  --font-display:"Comfortaa",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --border-radius:12px; --radius:10px;
  --sb:var(--lz-side-bg); --sb2:var(--lz-bg-alt); --pr:var(--lz-accent); --pr2:var(--lz-accent-hover);
  --ok:var(--lz-success-ink); --wn:var(--lz-warning-ink); --er:var(--lz-danger-ink); --bg:var(--lz-bg); --bd:var(--lz-border);
}
/* Bootstrap segue os tokens */
html[data-theme]{--bs-body-bg:var(--lz-bg);--bs-body-color:var(--lz-text);--bs-body-font-size:.875rem;--bs-border-color:var(--lz-border);--bs-secondary-color:var(--lz-text-muted);--bs-tertiary-bg:var(--lz-hover);--bs-emphasis-color:var(--lz-text);--bs-link-color:var(--lz-link);--bs-link-hover-color:var(--lz-link);--bs-border-radius:10px;--bs-border-radius-sm:10px;--bs-border-radius-lg:12px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--lz-bg);color:var(--lz-text);font-size:14px}
button,input,select,textarea{font-family:inherit}
h1,h2,h3,h4,h5,h6,.modal-title{font-family:var(--font-display);color:var(--lz-title)}
small,.small{font-size:.8125rem}
.text-muted{color:var(--lz-text-muted)!important}
a,.login-link{color:var(--lz-link)}
:focus-visible{outline:2px solid var(--lz-focus);outline-offset:2px}

/* ── SIDEBAR ── */
#sb{width:240px;min-width:240px;background:var(--lz-side-bg);color:var(--lz-side-text);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;border-right:1px solid var(--lz-side-border);transition:transform .2s}
#sb .logo{padding:18px 16px 14px;border-bottom:1px solid var(--lz-side-border);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#sb .logo img{height:56px;max-width:100%;object-fit:contain;display:block}
#sb .logo p{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--lz-side-title);letter-spacing:1.2px;text-transform:uppercase;margin:4px 0 0}
#sb nav{flex:1;min-height:0;overflow-y:auto;padding:6px 0 10px}
.ns{padding:14px 16px 5px;font-size:13px;font-weight:700;color:var(--lz-side-muted);letter-spacing:.8px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;border:none;border-left:3px solid transparent;background:none;width:100%;text-align:left;transition:all .15s;color:var(--lz-side-text);font-size:13px;font-weight:500;margin:1px 0;text-decoration:none;font-family:var(--font-body)}
.ni:hover{background:var(--lz-side-hover);color:var(--lz-side-text-strong)}
.ni.active{background:var(--lz-side-active);border-left-color:var(--lz-accent);color:var(--lz-side-text-strong);font-weight:600}
.ni i{width:16px;font-size:16px;flex-shrink:0;opacity:.9;line-height:1}
.ni:focus-visible{outline-offset:-2px}
#sb-footer{padding:12px 14px;border-top:1px solid var(--lz-side-border);display:flex;flex-direction:column;gap:8px}
.user-chip{background:var(--lz-side-control);border:1px solid var(--lz-side-border);color:var(--lz-side-text-strong);border-radius:var(--radius);padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{background:transparent;border:1px solid var(--lz-side-border);color:var(--lz-side-text);border-radius:var(--radius);padding:8px 12px;font-family:var(--font-body);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:background .2s}
.btn-logout:hover{background:var(--lz-side-active);border-color:var(--lz-accent);color:var(--lz-side-text-strong)}
#sb-footer .ver{color:var(--lz-side-muted);font-size:13px;text-align:center}
#navToggle{display:none;position:fixed;top:11px;left:12px;z-index:101;align-items:center;justify-content:center;width:40px;height:40px;background:var(--lz-bg-alt);border:1px solid var(--lz-border-strong);border-radius:var(--radius);color:var(--lz-text);cursor:pointer;font-size:20px;line-height:1}

/* ── MAIN / CABEÇALHO ── */
#main{margin-left:240px;min-height:100vh;padding:0}
#pg{padding:0 20px 16px}
.ph{background:var(--lz-bg-alt);border-bottom:1px solid var(--lz-border);margin:0 -20px 16px;padding:12px 190px 12px 20px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.ph h2{margin:0;font-size:18px;font-weight:700;color:var(--lz-title);letter-spacing:-.2px}
.ph p{margin:2px 0 0;color:var(--lz-text-muted);font-size:13px}
.theme-toggle{position:fixed;top:16px;right:20px;z-index:60;display:flex;gap:2px;background:var(--lz-hover);border-radius:999px;padding:3px;border:1px solid var(--lz-border-strong)}
.theme-toggle button{border:none;background:transparent;padding:4px 12px;border-radius:999px;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--lz-text-muted);cursor:pointer}
.theme-toggle button:hover{color:var(--lz-text)}
.theme-toggle button.active{background:var(--lz-accent);color:var(--lz-on-accent)}
@media (max-width:900px){
  #sb{transform:translateX(-100%)}
  #sb.open{transform:none;box-shadow:0 0 0 100vmax var(--lz-overlay)}
  #sb.open + #navToggle{left:192px}
  #navToggle{display:flex}
  #main{margin-left:0}
  #pg{padding:0 12px 16px}
  .ph{margin:0 -12px 14px;padding:12px 168px 12px 62px}
  .theme-toggle{right:12px}
}

/* ── CARDS ── */
.card,.sc,.dt,.stat-card{background:var(--lz-bg-alt);color:var(--lz-text);border:1px solid var(--lz-border);border-radius:var(--border-radius);box-shadow:var(--lz-shadow)}
.card,.dt{overflow:hidden}
.sc{padding:18px}
.dth,.card-header{padding:14px 18px;border-bottom:1px solid var(--lz-border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to right,var(--lz-surface-2),var(--lz-bg-alt))}
.dth h5,.card-header h3,.sc h6{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--lz-title);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px;margin:0}
.sc h6{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--lz-border)}
.dth h5 i,.sc h6 i{font-size:15px;color:var(--lz-info-ink)}
.dt table{margin:0}
.table{--bs-table-bg:transparent;--bs-table-color:var(--lz-text);--bs-table-border-color:var(--lz-border);--bs-table-hover-bg:var(--lz-hover);--bs-table-hover-color:var(--lz-text);--bs-table-striped-bg:var(--lz-hover)}
.table>thead>tr>th,.dt table th{padding:11px 14px;text-align:left;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--lz-title);text-transform:uppercase;letter-spacing:.5px;background-color:var(--lz-surface-2);border-bottom:2px solid var(--lz-border-strong)}
.table>tbody>tr>td,.dt table td{padding:7px 10px;border-bottom:1px solid var(--lz-border);font-size:14px;color:var(--lz-text);vertical-align:middle}
.table>tbody>tr:hover>*{background-color:var(--lz-hover)}
.dt table tr:last-child td{border-bottom:none}
.stat-card{padding:18px 20px;display:grid;grid-template-columns:46px 1fr;column-gap:14px;align-items:start;border-top:3px solid var(--lz-border-strong);transition:transform .15s,box-shadow .15s}
.stat-card:hover{transform:translateY(-1px);box-shadow:var(--lz-shadow-md)}
.stat-card:has(.si-info){border-top-color:var(--lz-info-ink)}
.stat-card:has(.si-ok){border-top-color:var(--lz-success-ink)}
.stat-card:has(.si-warn){border-top-color:var(--lz-warning-ink)}
.stat-icon{grid-row:1/3;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;color:var(--lz-info-ink)}
.si-info{background:var(--lz-info-bg);color:var(--lz-info-ink)}
.si-ok{background:var(--lz-success-bg);color:var(--lz-success-ink)}
.si-warn{background:var(--lz-warning-bg);color:var(--lz-warning-ink)}
.stat-card h3{font-size:30px;font-weight:700;line-height:1;color:var(--lz-text);letter-spacing:-1px;margin:0;align-self:end}
.stat-card p{margin:3px 0 0;color:var(--lz-text-muted);font-size:13px;font-weight:500}
.uz{border:2px dashed var(--lz-border-strong);border-radius:var(--border-radius);padding:36px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s}
.uz:hover,.uz.drag-over{border-color:var(--lz-accent);background:var(--lz-title-soft)}
.uz i{font-size:2rem;color:var(--lz-text-faint)}
.uz p{margin:6px 0 0;color:var(--lz-text-muted);font-size:14px}
.badge-D,.badge-C{padding:2px 9px;border-radius:20px;font-size:13px;font-weight:600}
.badge-D{background:var(--lz-warning-bg);color:var(--lz-warning-ink)}
.badge-C{background:var(--lz-success-bg);color:var(--lz-success-ink)}
.vd{color:var(--lz-danger-ink);font-weight:600}
.vc{color:var(--lz-success-ink);font-weight:600}
.alert-unid{background:var(--lz-warning-bg);border:1px solid var(--lz-warning-line);border-left:4px solid var(--lz-warning-ink);border-radius:10px;padding:14px;margin-bottom:14px;color:var(--lz-warning-ink)}
.hdr-warn{background:var(--lz-warning-bg)}
.bg-soft{background:var(--lz-surface-2)}
.tree-row{display:flex;align-items:center;padding:4px 0;font-size:14px}
.tree-row.l4{font-weight:600}
.blink{animation:blink .8s step-end infinite}
@keyframes blink{50%{opacity:0}}
.tag-novo,.tag-exist{padding:2px 9px;border-radius:20px;font-size:13px;font-weight:600}
.tag-novo{background:var(--lz-success-bg);color:var(--lz-success-ink)}
.tag-exist{background:var(--lz-info-bg);color:var(--lz-info-ink)}
.tag-banco{background:var(--lz-info-bg);color:var(--lz-info-ink);border:1px solid var(--lz-info-line);border-radius:20px;padding:3px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.progress{--bs-progress-bg:var(--lz-hover)}
.progress-bar{background-color:var(--lz-accent)}
.progress-bar-striped{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent)}
.empty-state{padding:40px 20px;text-align:center;color:var(--lz-text-faint)}
.empty-state .icon{font-size:44px;margin-bottom:8px;color:var(--lz-border-strong);display:flex;justify-content:center;line-height:1}
.empty-state p{font-size:14px}
.code-preview{background:var(--lz-code-bg);color:var(--lz-code-text);font-family:monospace;font-size:13px;padding:16px;max-height:400px;overflow-y:auto;border-radius:0 0 var(--border-radius) var(--border-radius)}

/* ── FORMULÁRIOS ── */
.form-control,.form-select,select.form-select,input.form-control,textarea.form-control{width:100%;padding:9px 12px;border:1px solid var(--lz-border-strong);border-radius:var(--radius);font-size:14px;color:var(--lz-text);background-color:var(--lz-input-bg);transition:border-color .15s,box-shadow .15s}
.form-control-sm,.form-select-sm{padding:5px 10px;font-size:13px}
.form-control::placeholder{color:var(--lz-text-faint)}
.form-control:disabled,.form-select:disabled{background-color:var(--lz-hover);color:var(--lz-text-muted)}
.form-control:focus,.form-select:focus{background-color:var(--lz-input-bg);color:var(--lz-text);outline:none;border-color:var(--lz-accent);box-shadow:0 0 0 3px var(--lz-accent-soft)}
select option,select optgroup{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;background:var(--lz-input-bg);color:var(--lz-text)}
label.form-label{display:block;font-size:13px;font-weight:600;color:var(--lz-text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form-check-label{font-size:14px;color:var(--lz-text)}
.form-check-input{background-color:var(--lz-input-bg);border-color:var(--lz-border-strong)}
.form-check-input:checked{background-color:var(--lz-accent);border-color:var(--lz-accent)}
.form-check-input:focus{border-color:var(--lz-accent);box-shadow:0 0 0 3px var(--lz-accent-soft)}
.input-group .form-control{width:auto}
.input-group-text{background:var(--lz-surface-2);color:var(--lz-text-muted);border-color:var(--lz-border-strong)}

/* ── BOTÕES ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-family:var(--font-body);font-size:14px;font-weight:600;border:1px solid transparent;transition:all .15s}
.btn-sm{padding:5px 11px;font-size:13px}
.btn.w-100{justify-content:flex-start}
.btn i{font-size:15px;line-height:1}
.btn-primary{--bs-btn-bg:var(--lz-accent);--bs-btn-border-color:var(--lz-accent);--bs-btn-color:var(--lz-on-accent);--bs-btn-hover-bg:var(--lz-accent-hover);--bs-btn-hover-border-color:var(--lz-accent-hover);--bs-btn-hover-color:var(--lz-on-accent);--bs-btn-active-bg:var(--lz-accent-hover);--bs-btn-active-border-color:var(--lz-accent-hover);--bs-btn-active-color:var(--lz-on-accent);--bs-btn-disabled-bg:var(--lz-accent);--bs-btn-disabled-border-color:var(--lz-accent);--bs-btn-disabled-color:var(--lz-on-accent)}
/* secundário da marca: borda e texto em --lz-title */
.btn-outline-primary{--bs-btn-color:var(--lz-title);--bs-btn-border-color:var(--lz-title);--bs-btn-hover-bg:var(--lz-title-soft);--bs-btn-hover-border-color:var(--lz-title);--bs-btn-hover-color:var(--lz-title);--bs-btn-active-bg:var(--lz-title-soft);--bs-btn-active-border-color:var(--lz-title);--bs-btn-active-color:var(--lz-title);--bs-btn-disabled-color:var(--lz-title);--bs-btn-disabled-border-color:var(--lz-title)}
/* contorno neutro */
.btn-outline-secondary,.btn-outline-warning,.btn-outline-info,.btn-outline-success{--bs-btn-color:var(--lz-text);--bs-btn-border-color:var(--lz-border-strong);--bs-btn-hover-bg:var(--lz-hover);--bs-btn-hover-border-color:var(--lz-title);--bs-btn-hover-color:var(--lz-title);--bs-btn-active-bg:var(--lz-hover);--bs-btn-active-border-color:var(--lz-title);--bs-btn-active-color:var(--lz-title);--bs-btn-disabled-color:var(--lz-text-muted);--bs-btn-disabled-border-color:var(--lz-border)}
.btn-success{--bs-btn-bg:var(--lz-success-bg-2);--bs-btn-border-color:var(--lz-success-line);--bs-btn-color:var(--lz-success-ink);--bs-btn-hover-bg:var(--lz-success-line);--bs-btn-hover-border-color:var(--lz-success-line);--bs-btn-hover-color:var(--lz-success-ink);--bs-btn-active-bg:var(--lz-success-line);--bs-btn-active-border-color:var(--lz-success-line);--bs-btn-active-color:var(--lz-success-ink);--bs-btn-disabled-bg:var(--lz-success-bg-2);--bs-btn-disabled-border-color:var(--lz-success-line);--bs-btn-disabled-color:var(--lz-success-ink)}
.btn-danger,.btn-outline-danger{--bs-btn-bg:var(--lz-danger-bg-2);--bs-btn-border-color:var(--lz-danger-line);--bs-btn-color:var(--lz-danger-ink);--bs-btn-hover-bg:var(--lz-danger-line);--bs-btn-hover-border-color:var(--lz-danger-line);--bs-btn-hover-color:var(--lz-danger-ink);--bs-btn-active-bg:var(--lz-danger-line);--bs-btn-active-border-color:var(--lz-danger-line);--bs-btn-active-color:var(--lz-danger-ink);--bs-btn-disabled-bg:var(--lz-danger-bg-2);--bs-btn-disabled-border-color:var(--lz-danger-line);--bs-btn-disabled-color:var(--lz-danger-ink)}
.btn-close{filter:none;opacity:.7}
[data-theme="dark"] .btn-close{filter:invert(1) grayscale(1) brightness(2)}

/* ── SELOS / UTILITÁRIOS BOOTSTRAP ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.bg-primary{background:var(--lz-accent-soft)!important;color:var(--lz-link)!important}
.badge.bg-success{background:var(--lz-success-bg-2)!important;color:var(--lz-success-ink)!important}
.badge.bg-warning,.badge.bg-warning.text-dark{background:var(--lz-warning-bg-2)!important;color:var(--lz-warning-ink)!important}
.badge.bg-danger{background:var(--lz-danger-bg-2)!important;color:var(--lz-danger-ink)!important}
.badge.bg-info{background:var(--lz-info-bg)!important;color:var(--lz-info-ink)!important}
.badge.bg-secondary{background:var(--lz-surface-3)!important;color:var(--lz-text)!important}
.rounded-circle.bg-primary{background-color:var(--lz-accent)!important;color:var(--lz-on-accent)!important}
.bg-light{background-color:var(--lz-surface-2)!important;color:var(--lz-text)!important}
.text-dark{color:var(--lz-text)!important}
.text-danger{color:var(--lz-danger-ink)!important}
.text-success{color:var(--lz-success-ink)!important}
.text-warning{color:var(--lz-warning-ink)!important}
.text-primary{color:var(--lz-link)!important}
.border-bottom{border-bottom-color:var(--lz-border)!important}

/* ── AVISOS, TOASTS, MODAIS, LISTAS ── */
.alert{border-radius:10px;font-size:13px;padding:12px 16px}
.alert-danger{--bs-alert-bg:var(--lz-danger-bg);--bs-alert-color:var(--lz-danger-ink);--bs-alert-border-color:var(--lz-danger-line);border-left:4px solid var(--lz-danger-ink)}
.alert-warning{--bs-alert-bg:var(--lz-warning-bg);--bs-alert-color:var(--lz-warning-ink);--bs-alert-border-color:var(--lz-warning-line);border-left:4px solid var(--lz-warning-ink)}
.alert-info{--bs-alert-bg:var(--lz-info-bg);--bs-alert-color:var(--lz-info-ink);--bs-alert-border-color:var(--lz-info-line);border-left:4px solid var(--lz-info-ink)}
.alert-success{--bs-alert-bg:var(--lz-success-bg);--bs-alert-color:var(--lz-success-ink);--bs-alert-border-color:var(--lz-success-line);border-left:4px solid var(--lz-success-ink)}
.alert-secondary{--bs-alert-bg:var(--lz-surface-2);--bs-alert-color:var(--lz-text);--bs-alert-border-color:var(--lz-border)}
.toast{border-radius:var(--radius);font-size:14px;font-weight:600;box-shadow:var(--lz-shadow-lg);border:1px solid var(--lz-border-strong);background:var(--lz-bg-alt);color:var(--lz-text)}
.toast.text-bg-success{background:linear-gradient(var(--lz-success-bg-2),var(--lz-success-bg-2)),var(--lz-bg-alt)!important;border-color:var(--lz-success-line);color:var(--lz-success-ink)!important}
.toast.text-bg-danger{background:linear-gradient(var(--lz-danger-bg-2),var(--lz-danger-bg-2)),var(--lz-bg-alt)!important;border-color:var(--lz-danger-line);color:var(--lz-danger-ink)!important}
.toast.text-bg-warning{background:linear-gradient(var(--lz-warning-bg-2),var(--lz-warning-bg-2)),var(--lz-bg-alt)!important;border-color:var(--lz-warning-line);color:var(--lz-warning-ink)!important}
.toast.text-bg-info{background:linear-gradient(var(--lz-info-bg),var(--lz-info-bg)),var(--lz-bg-alt)!important;border-color:var(--lz-info-line);color:var(--lz-info-ink)!important}
.toast .btn-close{filter:none}
[data-theme="dark"] .toast .btn-close{filter:invert(1) grayscale(1) brightness(2)}
.modal{--bs-modal-bg:var(--lz-bg-alt);--bs-modal-color:var(--lz-text);--bs-modal-border-color:var(--lz-border);--bs-modal-header-border-color:var(--lz-border);--bs-modal-footer-border-color:var(--lz-border);--bs-modal-border-radius:12px;--bs-modal-inner-border-radius:11px;--bs-modal-box-shadow:var(--lz-shadow-lg)}
.modal-backdrop{--bs-backdrop-bg:var(--lz-overlay);--bs-backdrop-opacity:1}
.modal-header{padding:18px 22px}
.modal-title{font-size:16px;font-weight:700;color:var(--lz-title)}
.modal-body{padding:22px}
.modal-footer{padding:16px 22px;background:var(--lz-surface-2);border-radius:0 0 12px 12px}
.list-group{--bs-list-group-bg:var(--lz-bg-alt);--bs-list-group-color:var(--lz-text);--bs-list-group-border-color:var(--lz-border);--bs-list-group-action-hover-bg:var(--lz-hover);--bs-list-group-action-hover-color:var(--lz-text);--bs-list-group-border-radius:10px}
.lz-modal-box{background:var(--lz-bg-alt);color:var(--lz-text);border:1px solid var(--lz-border);border-radius:12px;padding:24px;width:360px;max-width:92vw;box-shadow:var(--lz-shadow-lg)}
#pwOverlay{display:none;position:fixed;inset:0;z-index:99998;background:var(--lz-overlay);backdrop-filter:blur(2px);align-items:center;justify-content:center;padding:16px}

/* ── LOGIN ── */
#login-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:var(--lz-bg);padding:16px}
.login-box{background:var(--lz-bg-alt);border-radius:12px;border:1px solid var(--lz-border);padding:40px 44px;width:400px;max-width:90vw;box-shadow:var(--lz-shadow-lg);text-align:center}
.login-logo-wrap{background:var(--lz-side-bg);border-radius:12px;padding:10px 18px;margin-bottom:18px;display:flex;justify-content:center}
.login-logo-wrap .login-logo{height:56px;margin:0;object-fit:contain}
.login-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--lz-text);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--lz-text-muted);margin-bottom:24px}
.login-box .form-control{margin-bottom:10px;text-align:left}
.login-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 20px;background:var(--lz-accent);border:1px solid var(--lz-accent);border-radius:10px;font-size:14px;font-weight:600;color:var(--lz-on-accent);cursor:pointer;transition:background .2s}
.login-btn:hover:not(:disabled){background:var(--lz-accent-hover)}
.login-btn:disabled{opacity:.6;cursor:default}
#login-gate-status{margin-top:14px;font-size:13px;color:var(--lz-text-faint);min-height:16px}
.login-hint{margin-top:18px;font-size:13px;color:var(--lz-text-faint)}
.uz .uz-hint{font-size:13px;color:var(--lz-text-faint)}
.bg-primary{background-color:var(--lz-accent)!important}

/* ═══ PORTAL DO DEPARTAMENTO CONTÁBIL — componentes (só var(--lz-*)) ═══ */
:root,[data-theme="dark"],[data-theme="light"]{
  --teal:var(--lz-title); --red:var(--lz-danger-ink); --line:var(--lz-border); --muted:var(--lz-text-muted);
}
.side-info{font-size:13px;line-height:1.6;color:var(--lz-side-muted)}
.side-info b{color:var(--lz-side-text-strong);font-weight:500}
.ni .n{margin-left:auto;background:var(--lz-side-control);border-radius:10px;padding:0 8px;font-size:13px;color:var(--lz-side-text-strong)}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap}
#pg{max-width:none}
#view{min-width:0}
.hide{display:none!important}
.muted{color:var(--lz-text-muted)}
.small{font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.click{cursor:pointer}
.section{margin-top:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:1.35fr 1fr}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
#view .card,.drawer .card{padding:16px;overflow:visible}
#view .card h2,.drawer h2{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--lz-title);margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
.kpi .l{color:var(--lz-text-muted);font-size:13px}
.kpi .v{font-family:var(--font-display);font-weight:700;font-size:28px;margin-top:6px;color:var(--lz-text)}
.kpi .d{font-size:13px;color:var(--lz-text-muted);margin-top:4px}
.kpi.alert .v{color:var(--lz-danger-ink)}
.kpi.alert{border-top:3px solid var(--lz-danger-ink)}

/* botões do portal (só os sem classe btn-*, que já seguem o Bootstrap com tokens) */
#view .btn:not([class*="btn-"]),.drawer .btn:not([class*="btn-"]){background:var(--lz-bg-alt);border:1px solid var(--lz-border-strong);color:var(--lz-text);border-radius:var(--radius);padding:7px 14px;font-size:14px;font-weight:600}
#view .btn:not([class*="btn-"]):hover,.drawer .btn:not([class*="btn-"]):hover{border-color:var(--lz-title);color:var(--lz-title);background:var(--lz-hover)}
#view .btn.sm,.drawer .btn.sm{padding:5px 11px;font-size:13px}
#view .btn.primary,.drawer .btn.primary{background:var(--lz-accent);border-color:var(--lz-accent);color:var(--lz-on-accent)}
#view .btn.primary:hover,.drawer .btn.primary:hover{background:var(--lz-accent-hover);border-color:var(--lz-accent-hover);color:var(--lz-on-accent)}
#view .btn.danger,.drawer .btn.danger{background:var(--lz-danger-bg-2);border-color:var(--lz-danger-line);color:var(--lz-danger-ink)}
#view .btn.danger:hover,.drawer .btn.danger:hover{background:var(--lz-danger-line);border-color:var(--lz-danger-line);color:var(--lz-danger-ink)}
.btn:disabled{opacity:.55;cursor:default}

/* filtros e campos */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .count{margin-left:auto;color:var(--lz-text-muted);font-size:13px}
.filters input[type=search]{min-width:240px}
.filters input,.filters select,.field input,.field select,.field textarea,#view input[type=month],#dBody input[type=month],#view input[type=date],#view input[type=number]{
  border:1px solid var(--lz-border-strong);border-radius:var(--radius);padding:8px 11px;background-color:var(--lz-input-bg);color:var(--lz-text);font-size:14px;min-width:0}
.filters input:focus,.filters select:focus,.field input:focus,.field select:focus,.field textarea:focus,#view input[type=month]:focus,#dBody input[type=month]:focus{outline:none;border-color:var(--lz-accent);box-shadow:0 0 0 3px var(--lz-accent-soft)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;color:var(--lz-text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.field textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
input[type=checkbox]{accent-color:var(--lz-accent)}

/* tabelas */
.tbl-wrap{overflow:auto;border:1px solid var(--lz-border);border-radius:var(--border-radius);background:var(--lz-bg-alt);max-height:calc(100vh - 230px);box-shadow:var(--lz-shadow)}
.tbl-wrap table,.drawer table{border-collapse:collapse;width:100%}
.tbl-wrap th,.drawer th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--lz-border-strong);background:var(--lz-surface-2);font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--lz-title);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.tbl-wrap th{position:sticky;top:0;z-index:1;user-select:none}
.tbl-wrap th[data-sort]{cursor:pointer}
.tbl-wrap td,.drawer td{padding:8px 12px;border-bottom:1px solid var(--lz-border);font-size:14px;color:var(--lz-text);vertical-align:middle;white-space:nowrap}
td.wrap{white-space:normal;min-width:240px}
.tbl-wrap tbody tr:hover{background:var(--lz-hover)}
tr.click{cursor:pointer}

/* selos */
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:13px;font-weight:600;background:var(--lz-surface-3);color:var(--lz-text)}
.tag.LR{background:var(--lz-accent-soft);color:var(--lz-link)}
.tag.LP-S,.tag.LP-C{background:var(--lz-info-bg);color:var(--lz-info-ink)}
.tag.SN-S,.tag.SN-C{background:var(--lz-success-bg);color:var(--lz-success-ink)}
.tag.MEI,.tag.PF{background:var(--lz-surface-3);color:var(--lz-text-muted)}
.tag.IMU{background:var(--lz-warning-bg);color:var(--lz-warning-ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:20px;font-size:13px;font-weight:600}
.pill.red{background:var(--lz-danger-bg-2);color:var(--lz-danger-ink)}
.pill.amber{background:var(--lz-warning-bg-2);color:var(--lz-warning-ink)}
.pill.green{background:var(--lz-success-bg-2);color:var(--lz-success-ink)}
.pill.teal{background:var(--lz-info-bg);color:var(--lz-info-ink)}
.pill.gray{background:var(--lz-surface-3);color:var(--lz-text-muted)}
.bar{height:8px;background:var(--lz-surface-3);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--lz-info-ink);border-radius:6px}
.bar.red>i{background:var(--lz-danger-ink)}
.bar>i.reg-LR{background:var(--lz-accent)}
.bar>i.reg-LP{background:var(--lz-info-ink)}
.bar>i.reg-SN{background:var(--lz-success-ink)}
.bar>i.reg-OUT{background:var(--lz-border-strong)}
.stagebar{display:flex;flex-direction:column;gap:10px}
.stagebar .row{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:14px;margin:0}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--lz-border);font-size:14px}
.list .it:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.dot.red{background:var(--lz-danger-ink)}.dot.amber{background:var(--lz-warning-ink)}.dot.teal{background:var(--lz-info-ink)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow:auto;padding-bottom:6px}
.kcol{background:var(--lz-surface-2);border:1px solid var(--lz-border);border-radius:var(--border-radius);padding:10px;min-height:200px;max-height:calc(100vh - 230px);overflow:auto}
.kcol h3{display:flex;justify-content:space-between;font-size:13px;margin:2px 4px 10px;text-transform:uppercase;letter-spacing:.5px}
.kc{background:var(--lz-bg-alt);border:1px solid var(--lz-border);border-left:4px solid var(--lz-info-ink);border-radius:var(--radius);padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--lz-shadow-sm)}
.kc:hover{border-color:var(--lz-border-strong)}
.kc.p-Alta{border-left-color:var(--lz-danger-ink)}.kc.p-Média{border-left-color:var(--lz-warning-ink)}.kc.p-Baixa{border-left-color:var(--lz-info-ink)}
.kc .t{font-weight:600;font-size:14px;line-height:1.3;color:var(--lz-text)}
.kc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:13px;color:var(--lz-text-muted)}
.kc .pg{margin-top:7px}

/* gaveta lateral */
.overlay{position:fixed;inset:0;background:var(--lz-overlay);backdrop-filter:blur(2px);display:none;z-index:200}
.overlay.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(640px,100vw);background:var(--lz-bg-alt);color:var(--lz-text);border-left:1px solid var(--lz-border);z-index:201;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:var(--lz-shadow-lg)}
.drawer.on{transform:none}
.drawer header{padding:16px 20px;border-bottom:1px solid var(--lz-border);display:flex;gap:10px;align-items:flex-start;background:linear-gradient(to right,var(--lz-surface-2),var(--lz-bg-alt))}
.drawer header h2{margin:0;font-size:16px;line-height:1.35}
.drawer .body{padding:16px 20px;overflow:auto;flex:1}
.drawer footer{padding:12px 20px;border-top:1px solid var(--lz-border);display:flex;gap:8px;flex-wrap:wrap;background:var(--lz-surface-2)}
.x{margin-left:auto;border:0;background:none;font-size:24px;cursor:pointer;color:var(--lz-text-muted);line-height:1}
.x:hover{color:var(--lz-text)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--lz-text-muted);font-weight:500}.kv dd{margin:0}
.checks{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.checks label{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.checks label:hover{background:var(--lz-hover)}
.checks input{margin-top:4px}
.checks .done{color:var(--lz-text-muted);text-decoration:line-through}
.steps{display:flex;gap:4px;margin:4px 0 16px}
.steps span{flex:1;text-align:center;font-size:13px;padding:6px 2px;border-radius:8px;background:var(--lz-surface-2);color:var(--lz-text-muted)}
.steps span.on{background:var(--lz-accent);color:var(--lz-on-accent);font-weight:600}
.steps span.past{background:var(--lz-info-bg);color:var(--lz-info-ink)}
.docgrid{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin-bottom:14px;font-size:14px}
.docbtn{border:0;border-radius:20px;padding:3px 12px;font-size:13px;cursor:pointer;font-weight:600}
.d-pendente{background:var(--lz-danger-bg-2);color:var(--lz-danger-ink)}
.d-solicitado{background:var(--lz-warning-bg-2);color:var(--lz-warning-ink)}
.d-recebido{background:var(--lz-success-bg-2);color:var(--lz-success-ink)}

(function(){var b=document.getElementById('navToggle'),m=document.getElementById('sb');
function set(o){m.classList.toggle('open',o);b.setAttribute('aria-expanded',o?'true':'false');}
b.addEventListener('click',function(){set(!m.classList.contains('open'));});
m.addEventListener('click',function(e){if(e.target.closest('.ni'))set(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
document.addEventListener('keydown',function(e){var n=e.target.closest&&e.target.closest('.ni');if(n&&n.tagName!=='BUTTON'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();n.click();}});})();
/* Tema: dois temas (Escuro padrão e Claro); guarda a escolha */
function aplicarTema(t,salvar){if(t!=='light')t='dark';var h=document.documentElement;h.setAttribute('data-theme',t);h.setAttribute('data-bs-theme',t);
document.querySelectorAll('.theme-toggle button').forEach(function(b){var on=b.dataset.t===t;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false');});
if(salvar){try{localStorage.setItem('ps_theme',t);localStorage.setItem('ct_theme',t);}catch(e){}}}
aplicarTema(document.documentElement.getAttribute('data-theme')||'dark');
</script>

<script>

const SB_URL = "https://zllpbyvrfrwyntdyubzv.supabase.co";
const SB_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsbHBieXZyZnJ3eW50ZHl1Ynp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyOTkzOTgsImV4cCI6MjEwODg3NTM5OH0.lUedjoXUR4ZY9-nPfyJMb-hAyMzjAI_YDIKhxkIM4yw";
const sb = supabase.createClient(SB_URL, SB_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce'}});
let _papel = null;   // 'admin' | 'operador' | 'leitura'
let _userEmail = '';

// Trava visual reutilizável pra botões de salvar/confirmar: desabilita e
// mostra um spinner enquanto uma operação assíncrona roda,
// e devolve o texto original depois — evita a sensação de "travou".
function btnBusy(id, loadingHTML){
  const b=document.getElementById(id);
  if(!b) return {restore:()=>{}};
  const orig=b.innerHTML;
  b.disabled=true;
  b.innerHTML=loadingHTML||'<span class="spinner-border spinner-border-sm me-1"></span>Salvando...';
  return {restore:()=>{ b.disabled=false; b.innerHTML=orig; }};
}

// -------------------- login gate --------------------
async function gateLogin(){
  const btn=document.getElementById('login-gate-btn'), status=document.getElementById('login-gate-status');
  const email=document.getElementById('lgEmail').value.trim().toLowerCase(), senha=document.getElementById('lgSenha').value;
  if(!email||!senha){ status.textContent='Informe email e senha.'; return; }
  btn.disabled=true; status.textContent='Entrando...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
  if(error){ status.textContent='Email ou senha incorretos.'; btn.disabled=false; return; }
  try{ await bootAfterSession(data.session); }catch(e){ status.textContent='Erro ao carregar: '+e.message; btn.disabled=false; }
}

async function bootAfterSession(session){
  const status=document.getElementById('login-gate-status');
  _userEmail=(session.user.email||'').toLowerCase();
  status.textContent='Verificando permissão...';
  const {data,error}=await sb.from('usuarios_autorizados').select('papel,nome,ativo').eq('email',_userEmail).maybeSingle();
  if(error || !data || !data.ativo){
    await sb.auth.signOut();
    status.innerHTML='O email <b>'+_userEmail+'</b> não tem permissão neste portal. Peça acesso ao administrador.';
    document.getElementById('login-gate-btn').disabled=false;
    return;
  }
  _papel=data.papel;
  document.getElementById('userInfo').textContent=_userEmail+' · '+_papel;
  status.textContent='Carregando dados...';
  await carregarDados();
  document.getElementById('login-gate').style.display='none';
  iniciarPortal();
  if(session.user.user_metadata && session.user.user_metadata.must_change) abrirTrocaSenha(true);
}

async function trySilentLogin(){
  const status=document.getElementById('login-gate-status');
  try{
    const {data}=await sb.auth.getSession();
    if(!data.session) return;
    await bootAfterSession(data.session);
  }catch(e){ status.textContent='Erro ao carregar: '+e.message; }
}
async function sair(){ await sb.auth.signOut(); location.reload(); }

// -------------------- troca de senha --------------------
let _pwObrigatoria=false;
function abrirTrocaSenha(obrigatoria){
  _pwObrigatoria=!!obrigatoria;
  document.getElementById('pwTitulo').textContent=obrigatoria?'Defina uma nova senha':'Alterar senha';
  document.getElementById('pwDesc').textContent=obrigatoria?'Sua senha atual é temporária. Escolha uma nova (mínimo 10 caracteres).':'Escolha uma nova senha (mínimo 10 caracteres).';
  document.getElementById('pwCancelar').style.display=obrigatoria?'none':'';
  ['pwNova','pwNova2'].forEach(i=>document.getElementById(i).value=''); document.getElementById('pwErro').textContent='';
  document.getElementById('pwOverlay').style.display='flex';
}
function fecharTrocaSenha(){ document.getElementById('pwOverlay').style.display='none'; }
async function salvarNovaSenha(){
  const n1=document.getElementById('pwNova').value, n2=document.getElementById('pwNova2').value, er=document.getElementById('pwErro');
  if(n1.length<10){ er.textContent='A senha precisa ter pelo menos 10 caracteres.'; return; }
  if(n1!==n2){ er.textContent='As senhas não conferem.'; return; }
  const lock=btnBusy('pwSalvar');
  const {error}=await sb.auth.updateUser({password:n1, data:{must_change:false}});
  lock.restore();
  if(error){ er.textContent=error.message; return; }
  fecharTrocaSenha(); toast('Senha alterada!');
}

// -------------------- gestão de usuários (só admin) --------------------
let _usuarios=[];
async function admFn(body){
  const {data,error}=await sb.functions.invoke('admin-usuarios',{body});
  if(error){
    let m=error.message;
    try{ const j=await error.context.json(); if(j&&j.error) m=j.error; }catch(e){}
    throw new Error(m);
  }
  if(data&&data.error) throw new Error(data.error);
  return data;
}
function gerarSenhaTemp(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; const a=new Uint32Array(14); crypto.getRandomValues(a);
  return [...a].map(x=>c[x%c.length]).join('');
}
function renderUsuarios(){
  if(_papel!=='admin') return '<p class="text-danger">Acesso restrito a administradores.</p>';
  setTimeout(carregarUsuarios,0);
  return `<div class="card p-3 mb-3"><h6 class="mb-3">Novo usuário</h6>
    <div class="row g-2">
      <div class="col-md-4"><input id="uEmail" class="form-control form-control-sm" type="email" placeholder="Email"></div>
      <div class="col-md-3"><input id="uNome" class="form-control form-control-sm" placeholder="Nome"></div>
      <div class="col-md-2"><select id="uPapel" class="form-select form-select-sm"><option value="operador">Operador</option><option value="leitura">Leitura</option><option value="admin">Admin</option></select></div>
      <div class="col-md-3"><div class="input-group input-group-sm"><input id="uSenha" class="form-control" placeholder="Senha temporária"><button class="btn btn-outline-secondary" type="button" onclick="document.getElementById('uSenha').value=gerarSenhaTemp()" title="Gerar senha">Gerar</button></div></div>
    </div>
    <div class="d-flex align-items-center gap-3 mt-2"><button class="btn btn-primary btn-sm" id="btnCriarUsuario" onclick="criarUsuario()"><i class="bi bi-person-plus me-1"></i>Criar usuário</button>
    <small class="text-muted">A pessoa entra com essa senha e é obrigada a trocá-la no primeiro acesso. Passe a senha por um canal seguro.</small></div>
  </div>
  <div class="card"><div class="table-responsive"><table class="table table-sm align-middle mb-0">
    <thead><tr><th>Email</th><th>Nome</th><th style="width:140px">Papel</th><th style="width:90px">Ativo</th><th style="width:210px"></th></tr></thead>
    <tbody id="usuariosBody"><tr><td colspan="5" class="text-muted p-3">Carregando...</td></tr></tbody></table></div></div>
  <p class="small text-muted mt-2"><b>Admin</b>: tudo, inclusive usuários. <b>Operador</b>: lê e grava dados. <b>Leitura</b>: só consulta.</p>`;
}
async function carregarUsuarios(){
  const {data,error}=await sb.from('usuarios_autorizados').select('*').order('email');
  const body=document.getElementById('usuariosBody'); if(!body) return;
  if(error){ body.innerHTML='<tr><td colspan="5" class="text-danger p-3">'+error.message+'</td></tr>'; return; }
  _usuarios=data;
  body.innerHTML=data.map(u=>{
    const eu=u.email===_userEmail, sup=!!u.super_admin;
    const trava=eu||sup;
    return `<tr><td>${u.email}${eu?' <span class="badge bg-secondary">você</span>':''}${sup?' <span class="badge bg-primary" title="Protegido: não pode ser excluído, desativado ou rebaixado">super admin</span>':''}</td><td>${u.nome||''}</td>
      <td><select class="form-select form-select-sm" ${trava?'disabled':''} onchange="mudarPapelUsuario('${u.email}',this.value)">
        ${['admin','operador','leitura'].map(p=>`<option value="${p}" ${u.papel===p?'selected':''}>${p}</option>`).join('')}</select></td>
      <td><div class="form-check form-switch"><input class="form-check-input" type="checkbox" ${u.ativo?'checked':''} ${trava?'disabled':''} aria-label="Ativo" onchange="mudarAtivoUsuario('${u.email}',this.checked)"></div></td>
      <td class="text-end">${sup?'':`<button class="btn btn-outline-secondary btn-sm me-1" onclick="redefinirSenhaUsuario('${u.email}')">Redefinir senha</button>
        <button class="btn btn-outline-danger btn-sm" ${eu?'disabled':''} onclick="excluirUsuario('${u.email}')" aria-label="Excluir usuário"><i class="bi bi-trash"></i></button>`}</td></tr>`;
  }).join('')||'<tr><td colspan="5" class="text-muted p-3">Nenhum usuário.</td></tr>';
}
async function criarUsuario(){
  const email=document.getElementById('uEmail').value.trim().toLowerCase(), nome=document.getElementById('uNome').value.trim(),
        papel=document.getElementById('uPapel').value, senha=document.getElementById('uSenha').value;
  if(!email){ toast('Informe o email','danger'); return; }
  if(senha.length<10){ toast('A senha temporária precisa ter pelo menos 10 caracteres','danger'); return; }
  const lock=btnBusy('btnCriarUsuario','<span class="spinner-border spinner-border-sm me-1"></span>Criando...');
  try{ await admFn({acao:'criar',email,nome,papel,senha}); toast('Usuário criado! Senha temporária: '+senha,'success'); render(); }
  catch(err){ lock.restore(); toast('Erro: '+err.message,'danger'); }
}
async function mudarPapelUsuario(email,papel){
  const {error}=await sb.from('usuarios_autorizados').update({papel}).eq('email',email);
  if(error) toast('Erro: '+error.message,'danger'); else toast('Papel atualizado');
  carregarUsuarios();
}
async function mudarAtivoUsuario(email,ativo){
  const {error}=await sb.from('usuarios_autorizados').update({ativo}).eq('email',email);
  if(error) toast('Erro: '+error.message,'danger'); else toast(ativo?'Usuário ativado':'Usuário desativado','warning');
  carregarUsuarios();
}
async function redefinirSenhaUsuario(email){
  const senha=gerarSenhaTemp();
  if(!confirm('Redefinir a senha de '+email+'? Será gerada uma senha temporária.')) return;
  try{ await admFn({acao:'redefinir',email,senha}); toast('Senha temporária de '+email+': '+senha,'success'); }
  catch(err){ toast('Erro: '+err.message,'danger'); }
}
async function excluirUsuario(email){
  if(!confirm('Excluir o usuário '+email+'? Ele perde o acesso definitivamente.')) return;
  try{ await admFn({acao:'excluir',email}); toast('Usuário excluído','warning'); carregarUsuarios(); }
  catch(err){ toast('Erro: '+err.message,'danger'); }
}
</script>

async function tudo(tabela, ordem){
  const out=[];
  for(let ini=0;;ini+=1000){
    const {data,error}=await sb.from(tabela).select('*').order(ordem).range(ini,ini+999);
    if(error) throw new Error(tabela+': '+error.message);

}

}

function persistir(acao){
  S.salvoEm=new Date().toISOString();
  if(acao){ S.log.unshift({data:S.salvoEm,acao,usuario:_userEmail}); S.log=S.log.slice(0,300); _logPend.push(acao); }
  if(_papel==='leitura'){ setTimeout(()=>toast('Seu perfil é somente leitura: a alteração não foi gravada.','warning'),500); clearTimeout(_syncT); _syncT=setTimeout(()=>{_syncT=null;recarregar();},1800); return; }
  setSync('gravando…',false);
  clearTimeout(_syncT); _syncT=setTimeout(()=>{ _syncT=null; _syncP=_syncP.then(sincronizar); },600);
}
async function sincTabela(tabela, atual, snap, pk){
  const up=Object.entries(atual).filter(([id,r])=>snap[id]!==JSON.stringify(r));
  const del=Object.keys(snap).filter(id=>!(id in atual));
  for(let i=0;i<up.length;i+=100){
    const lote=up.slice(i,i+100);
    const {error}=await sb.from(tabela).upsert(lote.map(x=>x[1]),{onConflict:pk});
    if(error) throw new Error(tabela+': '+error.message);
    lote.forEach(([id,r])=>{snap[id]=JSON.stringify(r);});
  }
  for(let i=0;i<del.length;i+=100){
    const lote=del.slice(i,i+100);
    const {error}=await sb.from(tabela).delete().in(pk,lote);
    if(error) throw new Error(tabela+': '+error.message);
    lote.forEach(id=>{delete snap[id];});
  }
}
async function sincronizar(){
  _syncing=true;
  try{
    const r=estadoRows();
    await sincTabela('controle_empresa',r.emp,SNAP.emp,'cliente_id');
    await sincTabela('fechamentos',r.fech,SNAP.fech,'cliente_id');
    await sincTabela('onboarding',r.onb,SNAP.onb,'cliente_id');
    await sincTabela('melhorias',r.mel,SNAP.mel,'id');
    if(SNAP.cfg!==r.cfg){
      const {error}=await sb.from('configuracoes').update({equipe:S.equipe,regras:S.regras}).eq('id',1);
      if(error) throw new Error('configuracoes: '+error.message);
      SNAP.cfg=r.cfg;
    }
    if(_logPend.length){
      const lote=_logPend.splice(0,_logPend.length);
      const {error}=await sb.from('historico_portal').insert(lote.map(acao=>({acao})));
      if(error){ _logPend.unshift(...lote); throw new Error('historico_portal: '+error.message); }
    }
    if(_orfaos) toast(`${_orfaos} registro(s) de empresas que não estão na lista do Acessórias não foram gravados.`,'warning');
    clearTimeout(_retryT);
    setSync('salvo '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),false);
  }catch(e){
    setSync('erro ao gravar',true); toast('Erro ao gravar: '+e.message,'danger');
    clearTimeout(_retryT); _retryT=setTimeout(()=>{ if(!_syncT) _syncP=_syncP.then(sincronizar); },15000);
  }finally{ _syncing=false; }
}

  if(!Array.isArray(o.empresas)||!o.empresas.length) throw new Error('o arquivo não tem a lista de empresas.');

  const mes=v=>{ v=String(v||''); return /^\d{4}-\d{2}/.test(v)?v.slice(0,7):null; };
  const agora=new Date().toISOString(), obr=o.obrigacoes||{}, ent=o.entregas||{};
  const grupos={};
  o.empresas.forEach(e=>{
    const id=String(e.id), ob=obr[id]||obr[e.id], en=ent[id]||ent[e.id];
    const r={id, razao:e.razao||e.fantasia||id, fantasia:vazioNull(e.fantasia), cnpj:vazioNull(e.cnpj), regime:vazioNull(e.regime), grupo:vazioNull(e.grupo), uf:vazioNull(e.uf),
      desde:dt(e.desde), cadastro:dt(e.cadastro), ate:dt(e.ate), resp_dc:vazioNull(e.resp_dc), ult_sp:mes(e.ult_sp), ult_sp_status:vazioNull(e.ult_sp_status), ult_sp_origem:vazioNull(e.ult_sp_origem), atualizado_em:agora};
    if(ob){ r.obrigacoes_atualizado=vazioNull(ob.atualizado); r.obrigacoes=ob.obrigacoes||[]; }
    if(en){ r.entregas_periodo=vazioNull(en.periodo); r.entregas=en.itens||[]; }
    (grupos[(ob?1:0)+''+(en?1:0)]=grupos[(ob?1:0)+''+(en?1:0)]||[]).push(r);   // mesmas colunas por lote: não apaga obrigações já gravadas
  });
  const chunks=(arr,n)=>{const out=[];for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));return out;};
  let n=0;
  for(const rows of Object.values(grupos)) for(const lote of chunks(rows,100)){
    const {error}=await sb.from('clientes').upsert(lote,{onConflict:'id'}); if(error) throw new Error('clientes: '+error.message); n+=lote.length;
  }

  const sol=(o.solicitacoes||[]).map(s=>({id:String(s.id),assunto:vazioNull(s.assunto),empresa:vazioNull(s.empresa),empresa_id:vazioNull(s.empresa_id)===null?null:String(s.empresa_id),status:vazioNull(s.status),abertura:vazioNull(s.abertura),responsaveis:vazioNull(s.responsaveis)}));

  r1=await sb.from('sincronizacoes').delete().gte('id',0); if(r1.error) throw new Error('sincronizacoes: '+r1.error.message);
  const sin=(o.sincronizacoes||[]).map(s=>({data:vazioNull(s.data),tipo:vazioNull(s.tipo),obs:vazioNull(s.obs)}));
  for(const lote of chunks(sin,100)){ const {error}=await sb.from('sincronizacoes').insert(lote); if(error) throw new Error('sincronizacoes: '+error.message); }
  const resp=Object.entries(o.onboarding_respostas||{}).map(([cnpj,r])=>({cnpj:String(cnpj).replace(/\D/g,''),respondido_em:vazioNull(r.respondido_em),respostas:r.respostas||{},aceite:!!r.aceite,respondente:vazioNull(r.respondente),email:vazioNull(r.email)}));
  for(const lote of chunks(resp,100)){ const {error}=await sb.from('onboarding_respostas').upsert(lote,{onConflict:'cnpj'}); if(error) throw new Error('onboarding_respostas: '+error.message); }

  await sb.from('historico_portal').insert({acao:`Carga do Acessórias: ${n} clientes, ${sol.length} solicitações`});

}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym = d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const COMP_ATUAL = ym(HOJE);                   // mês corrente (ainda em aberto)
const addM=(c,n)=>{const [y,m]=c.split('-').map(Number);const d=new Date(y,m-1+n,1);return ym(d);};
const diffM=(a,b)=>{const [ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+(mb-ma);};
const fmtC = c=>c?c.slice(5,7)+'/'+c.slice(0,4):'—';
const fmtD = d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—';
const toast=(msg,type='success')=>{const el=document.getElementById('tst'),m=document.getElementById('tstMsg');el.className=`toast align-items-center border-0 text-bg-${type}`;m.textContent=msg;new bootstrap.Toast(el,{delay:type==='danger'?6000:3200}).show();};
const nomeEmp = e=>e.fantasia && e.fantasia!==e.razao ? `${e.razao}` : e.razao;
const regimeGrupo = r=>r==='LR'?'LR':(r||'').startsWith('LP')?'LP':(r||'').startsWith('SN')?'SN':'OUTROS';

let EMP = {};
function reindexar(){ EMP={}; D.empresas.forEach(e=>EMP[e.id]=e); }
function ctl(id){ return S.empresas[id] || (S.empresas[id]={}); }
function emEscopo(e){ const c=S.empresas[e.id]||{}; if(c.escopo===true) return true; if(c.escopo===false) return false; return !S.regras.foraEscopo.includes(e.regime); }
function ultimoFech(e){ const c=S.empresas[e.id]||{}; const sp=e.ult_sp||'', man=c.ultimo||''; if(man && man>sp) return {ym:man,fonte:'Portal'}; if(sp) return {ym:sp,fonte:'SharePoint',status:e.ult_sp_status,origem:e.ult_sp_origem}; return {ym:'',fonte:''}; }
function entrada(e){ return (e.desde||e.cadastro||'').slice(0,7); }
function inicioFech(e){ const o=S.onboarding[e.id]; if(o&&o.inicio) return o.inicio; const en=entrada(e); return en?addM(en,S.regras.carenciaMeses):''; }
function responsavel(e){ const c=S.empresas[e.id]||{}; return c.resp || e.resp_dc || ''; }
function balancetesAtrasadosAcess(id){
  const o=D.obrigacoes[id]; if(!o) return null;
  return o.obrigacoes.filter(x=>/BALANCETE/i.test(x.nome)&&x.status==='Ativa').reduce((s,x)=>s+Number(x.atrasadas||0),0);
}
/* Passivo: meses não fechados.
   - competência inicial devida = mês de entrada do cliente
   - até a competência meta (regra: realizado até 09/2026) → "a realizar"
   - novos clientes cujo início do fechamento (entrada + carência) é posterior à competência meta ficam fora */
function passivo(e){
  const c=S.empresas[e.id]||{}; const meta=S.regras.competenciaMeta;
  const ini=inicioFech(e); const en=entrada(e);
  const foraMeta = ini && ini>meta;
  const uf = ultimoFech(e); const ult = uf.ym;
  let ateMeta=null, ateHoje=null;
  // sem fechamento realizado: o passivo conta desde a competência de entrada do cliente
  // sem fechamento na Lucralize: começa no mês seguinte ao último balancete da contabilidade anterior (onboarding 6.2); sem essa resposta, na entrada
  const balAnt = /^\d{4}-\d{2}$/.test(((S.onboarding[e.id]||{}).quest||{}).ultimo_balancete||'') ? S.onboarding[e.id].quest.ultimo_balancete : '';
  let prim = ult ? addM(ult,1) : (balAnt ? addM(balAnt,1) : en);
  if(ult && en && en>prim) prim=en;
  if(prim){
    ateMeta = Math.max(0, diffM(prim, meta)+1);
    ateHoje = Math.max(0, diffM(prim, addM(COMP_ATUAL,-1))+1);
  }
  return {ult, semFech:!ult, desdeEntrada: !ult ? prim : '', baseInicio: ult ? 'fechamento' : balAnt ? 'anterior' : 'entrada', balAnt, fonte:uf.fonte, spStatus:uf.status, spOrigem:uf.origem, ateMeta: foraMeta?0:ateMeta, ateHoje, foraMeta, inicio:ini, estimAcess:balancetesAtrasadosAcess(e.id)};
}
function fech(id){
  let f=S.fechamentos[id];
  if(!f){ const u=EMP[id]?ultimoFech(EMP[id]).ym:''; f={competencia: u?addM(u,1):'', etapa:0, checks:{}, docs:{}, notas:''}; }
  return f;
}
function fechAtivo(id){ return !!S.fechamentos[id]; }
function prazoInicio(e,comp){ if(!comp) return ''; const dia=S.regras.diaInicio[regimeGrupo(e.regime)]||15; const m=addM(comp,1); return m+'-'+String(dia).padStart(2,'0'); }
function docsCompletos(f){ return DOCS.every(([k])=>['recebido','na'].includes(f.docs[k])); }
function progressoEtapa(f){
  if(f.etapa===0){ const tot=DOCS.length; const ok=DOCS.filter(([k])=>['recebido','na'].includes(f.docs[k])).length; return [ok,tot]; }
  const lst=CHECKS[f.etapa]||[]; return [lst.filter(([k])=>f.checks[k]).length, lst.length];
}
function prioridade(e){
  const f=fech(e.id), p=passivo(e); let s=0;
  s += {LR:30,LP:20,SN:10,OUTROS:8}[regimeGrupo(e.regime)];
  if(p.ateHoje) s += Math.min(p.ateHoje,12)*4;
  if(docsCompletos(f)) s += 12;
  const pi=prazoInicio(e,f.competencia); const atrasoIni = pi && f.etapa===0 && new Date(pi)<HOJE;
  if(atrasoIni) s += 15;
  const nivel = s>=55?'Alta':s>=35?'Média':'Baixa';
  return {score:s,nivel,atrasoIni,prazoIni:pi};
}
function proximaBusca(){
  const d=new Date(HOJE); d.setHours(8,0,0,0);
  for(let i=0;i<8;i++){ const x=new Date(d); x.setDate(d.getDate()+i); if([1,4].includes(x.getDay()) && x>HOJE) return x; }
}

function novosClientes(){
  const corte=addM(COMP_ATUAL,-6);
  return D.empresas.filter(e=>{ const en=entrada(e); return (en && en>=corte) || S.onboarding[e.id]; })
    .sort((a,b)=>(b.desde||b.cadastro).localeCompare(a.desde||a.cadastro));
}
function onb(id){ return S.onboarding[id] || (S.onboarding[id]={checks:{},quest:{}}); }
function onbConcluido(id){ const o=S.onboarding[id]; return o && ONB_CHECKS.every(([k])=>o.checks[k]); }
function respostaCliente(e){ return (D.onboarding_respostas||{})[(e.cnpj||'').replace(/\D/g,'')] || null; }
function linkCliente(e){ const l=S.regras.formLink||''; return l ? l.replace(/\{CNPJ\}|%7BCNPJ%7D/gi,encodeURIComponent(e.cnpj)).replace(/\{EMPRESA\}|%7BEMPRESA%7D/gi,encodeURIComponent(e.razao)) : ''; }
function importarRespostas(){
  let n=0;
  D.empresas.forEach(e=>{ const r=respostaCliente(e); if(!r) return; const o=onb(e.id); if(o.importado===r.respondido_em) return;
    QUESTOES.forEach(q=>{ let v=(r.respostas||{})[q.k]; if(v && q.t==='mes'){ const m=String(v).match(/(\d{1,2})\D(\d{4})/); if(m) v=m[2]+'-'+m[1].padStart(2,'0'); } if(v && !o.quest[q.k]) o.quest[q.k]=String(v); });
    o.checks.quest=true; if(r.aceite) o.checks.termo=true;
    o.respondido=r.respondido_em; o.respondente=r.respondente||''; o.respondenteEmail=r.email||''; o.aceite=!!r.aceite; o.importado=r.respondido_em; n++;
    S.log.unshift({data:new Date().toISOString(),acao:`Questionário respondido pelo cliente: ${e.razao} (${r.respondido_em})`});
  });
  if(n) persistir();
  return n;
}

function campoQuest(q,v){
  const lab=`<label>${q.n?q.n+' ':''}${esc(q.l)}${q.o?' *':''}</label>`, dica=q.h?`<span class="small muted">${esc(q.h)}</span>`:'';
  if(q.t==='escolha') return `<div class="field">${lab}<select data-q="${q.k}"><option value="">—</option>${q.op.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}${v&&!q.op.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>${dica}</div>`;
  if(q.t==='multipla'){ const sel=v.split(/;\s*/).filter(Boolean); return `<div class="field">${lab}<div class="checks" style="flex-direction:row;flex-wrap:wrap;margin:0">${q.op.map(x=>`<label><input type="checkbox" data-qm="${q.k}" value="${esc(x)}" ${sel.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div>${sel.filter(x=>!q.op.includes(x)).length?`<span class="small">Outros informados: ${esc(sel.filter(x=>!q.op.includes(x)).join('; '))}</span>`:''}${dica}</div>`; }
  if(q.t==='mes') return `<div class="field">${lab}<input type="month" data-q="${q.k}" value="${esc(v)}">${dica}</div>`;
  return `<div class="field">${lab}<textarea data-q="${q.k}" style="min-height:44px">${esc(v)}</textarea>${dica}</div>`;
}

function iniciarFechamento(id,comp){
  const c=ctl(id);
  S.fechamentos[id]={competencia: comp || (ultimoFech(EMP[id]).ym?addM(ultimoFech(EMP[id]).ym,1):(passivo(EMP[id]).desdeEntrada||entrada(EMP[id]))), etapa:0, checks:{}, docs:{}, notas:'', iniciado:new Date().toISOString()};
}
function abrirFechamento(id){
  const e=EMP[id];
  if(!fechAtivo(id)){
    const c=ctl(id);
    const u=ultimoFech(e).ym;
    if(!u && !inicioFech(e)){ toast('Informe o último fechamento da empresa primeiro'); abrirEmpresa(id); return; }
    iniciarFechamento(id, u?addM(u,1):(passivo(e).desdeEntrada||entrada(e))); persistir(`Fechamento iniciado: ${e.razao}`);
  }
  const f=S.fechamentos[id]; const p=prioridade(e); const pa=passivo(e);
  const etapaHtml = f.etapa===0 ? `
      <h3>Documentação financeira — ${fmtC(f.competencia)}</h3>
      <div class="docgrid">${DOCS.map(([k,l])=>{const s=f.docs[k]||'pendente';return `<span>${l}</span><button class="docbtn d-${s}" data-doc="${k}" data-id="${id}">${DOC_ROTULO[s]}</button>`;}).join('')}</div>`
    : f.etapa<4 ? `<h3>${ETAPAS[f.etapa]} — ${fmtC(f.competencia)}</h3><div class="checks">${CHECKS[f.etapa].map(([k,l])=>`<label><input type="checkbox" data-ck="${k}" ${f.checks[k]?'checked':''}><span class="${f.checks[k]?'done':''}">${l}</span></label>`).join('')}</div>`
    : `<div class="note">Competência ${fmtC(f.competencia)} concluída. Use “Abrir próxima competência” para seguir com o passivo.</div>`;
  openDrawer(`Fechamento ${fmtC(f.competencia)} — ${esc(e.razao)}<div class="small muted" style="font-family:Poppins;font-weight:400">${REGIME_NOME[e.regime]} · ${esc(responsavel(e)||'sem responsável')}</div>`,`
    <div class="steps">${ETAPAS.map((n,i)=>`<span class="${i===f.etapa?'on':i<f.etapa?'past':''}">${n}</span>`).join('')}</div>
    <dl class="kv">
      <dt>Prioridade</dt><dd><span class="pill ${p.nivel==='Alta'?'red':p.nivel==='Média'?'amber':'gray'}">${p.nivel}</span> <span class="small muted">pontuação ${p.score}</span></dd>

      <dt>Meses em aberto</dt><dd>${pa.ateHoje??'—'} ${pa.estimAcess?`<span class="small muted">· Acessórias: ${pa.estimAcess} balancete(s) atrasado(s)</span>`:''}</dd>
      <dt>Competência</dt><dd><input type="month" id="fComp" value="${esc(f.competencia)}" style="border:1px solid var(--line);border-radius:6px;padding:3px 6px"></dd>
    </dl>
    ${etapaHtml}
    <div class="field"><label>Notas do fechamento (pendências, ajustes, achados)</label><textarea id="fNotas">${esc(f.notas||'')}</textarea></div>
    ${f.etapa===3?`<button class="btn sm" data-act="melhoria-de" data-id="${id}">Registrar ponto de melhoria</button>`:''}
  `,`${f.etapa>0&&f.etapa<4?`<button class="btn" data-act="etapa" data-id="${id}" data-d="-1">← Voltar etapa</button>`:''}
    ${f.etapa<3?`<button class="btn primary" data-act="etapa" data-id="${id}" data-d="1">Avançar para ${ETAPAS[f.etapa+1]} →</button>`:''}
    ${f.etapa===3?`<button class="btn primary" data-act="concluir" data-id="${id}">Concluir competência ${fmtC(f.competencia)}</button>`:''}
    ${f.etapa===4?`<button class="btn primary" data-act="proxima" data-id="${id}">Abrir próxima competência (${fmtC(addM(f.competencia,1))})</button>`:''}
    <button class="btn" data-act="abrir-emp" data-id="${id}">Ficha da empresa</button>
    <button class="btn danger" data-act="cancelar-fech" data-id="${id}" style="margin-left:auto">Encerrar controle</button>`);
  $('#dBody').querySelectorAll('[data-ck]').forEach(el=>el.addEventListener('change',()=>{f.checks[el.dataset.ck]=el.checked;el.nextElementSibling.className=el.checked?'done':'';persistir(`${e.razao} ${fmtC(f.competencia)}: ${el.dataset.ck}=${el.checked}`);render();}));
  $('#fNotas').addEventListener('change',ev=>{f.notas=ev.target.value;persistir(`Notas ${e.razao}`);});
  $('#fComp').addEventListener('change',ev=>{f.competencia=ev.target.value;persistir(`${e.razao}: competência ${ev.target.value}`);render();abrirFechamento(id);});

function mudarEtapa(id,d){
  const f=S.fechamentos[id]; const e=EMP[id];
  if(d>0){
    if(f.etapa===0 && !docsCompletos(f) && !confirm('Há documentos pendentes. Avançar mesmo assim?')) return;
    if(f.etapa>0){ const [ok,tot]=progressoEtapa(f); if(ok<tot && !confirm(`${tot-ok} item(ns) da etapa ainda não marcados. Avançar mesmo assim?`)) return; }
  }
  f.etapa=Math.max(0,Math.min(4,f.etapa+d)); persistir(`${e.razao} ${fmtC(f.competencia)}: etapa ${ETAPAS[f.etapa]}`); render(); abrirFechamento(id);
}
function concluir(id){
  const f=S.fechamentos[id]; const e=EMP[id]; const [ok,tot]=progressoEtapa(f);
  if(ok<tot && !confirm(`${tot-ok} item(ns) da auditoria não marcados. Concluir mesmo assim?`)) return;
  f.etapa=4; f.concluido=new Date().toISOString();
  const c=ctl(id); if(f.competencia>ultimoFech(e).ym) c.ultimo=f.competencia;
  (c.historico=c.historico||[]).push({competencia:f.competencia,concluido:f.concluido,resp:responsavel(e)});
  persistir(`Fechamento concluído: ${e.razao} ${fmtC(f.competencia)}`); toast(`${fmtC(f.competencia)} concluída — último fechamento atualizado`); render(); abrirFechamento(id);
}

        <div class="field"><label>Dia de início — Lucro Real</label><input type="number" min="1" max="28" data-dia="LR" value="${r.diaInicio.LR}"></div>
        <div class="field"><label>Dia de início — Lucro Presumido</label><input type="number" min="1" max="28" data-dia="LP" value="${r.diaInicio.LP}"></div>
        <div class="field"><label>Dia de início — Simples Nacional</label><input type="number" min="1" max="28" data-dia="SN" value="${r.diaInicio.SN}"></div>
        <div class="field"><label>Dia de início — Outros</label><input type="number" min="1" max="28" data-dia="OUTROS" value="${r.diaInicio.OUTROS}"></div>
      </div>
      <div class="field"><label>Link do formulário de onboarding (Microsoft Forms, link pré-preenchido)</label><input data-r="formLink" value="${esc(r.formLink||'')}" placeholder="https://forms.office.com/r/...&r...={CNPJ}&r...={EMPRESA}"><span class="small muted">No link pré-preenchido do Forms, troque o CNPJ de exemplo por {CNPJ} e a razão social por {EMPRESA}. O portal gera o link de cada cliente com esses campos preenchidos.</span></div>
      <div class="field"><label>Regimes fora do escopo contábil (padrão)</label><div class="checks" style="flex-direction:row;flex-wrap:wrap">${Object.entries(REGIME_NOME).map(([k,v])=>`<label><input type="checkbox" data-fora="${k}" ${r.foraEscopo.includes(k)?'checked':''}>${v}</label>`).filter((_,i)=>!['MEI','PF',''].includes(Object.keys(REGIME_NOME)[i])).join('')}</div></div>
      <p class="small muted">Dia de início: data limite, no mês seguinte à competência, para iniciar o fechamento. Após essa data, o fechamento ainda na etapa Documentação gera alerta.</p>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><h2>Equipe</h2>
        <div class="field"><label>Um nome por linha</label><textarea id="eq" style="min-height:130px">${esc(S.equipe.join('\n'))}</textarea></div>
        <button class="btn sm" data-act="salvar-equipe">Salvar equipe</button>
      </div>
      <div class="card"><h2>Armazenamento</h2>
        <p class="small" style="margin-top:0;line-height:1.6">Os controles da equipe (fechamentos, onboarding, passivo, melhorias, equipe e regras) são gravados automaticamente no Supabase, compartilhados por toda a equipe e com registro de quem alterou cada item. Cadastro, obrigações e solicitações vêm do Acessórias pela carga abaixo.</p>
        <p class="small muted">Última carga do Acessórias: ${esc(D.gerado_em||'—')} · ${D.empresas.length} clientes</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" data-act="importar-dados" ${_papel==='leitura'?'disabled':''}>Carregar dados_portal.js</button><button class="btn sm" data-act="exportar-estado" title="Baixa um backup JSON dos controles da equipe">Exportar backup</button><button class="btn sm" data-act="importar-estado" ${_papel==='leitura'?'disabled':''} title="Restaura um backup JSON ou o portal_estado.js antigo">Importar backup</button></div>
      </div>
      <div class="card"><h2>Histórico de alterações</h2><div class="list" style="max-height:260px;overflow:auto">${S.log.slice(0,60).map(l=>`<div class="it small"><span class="muted" style="min-width:118px">${new Date(l.data).toLocaleString('pt-BR')}</span><span>${l.usuario?`<b>${esc(l.usuario.split('@')[0])}</b> · `:''}${esc(l.acao)}</span></div>`).join('')||'<div class="empty">Sem alterações.</div>'}</div></div>
    </div>
  </div>`;
  document.querySelectorAll('[data-r]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.r;S.regras[k]=el.type==='number'?Number(el.value):el.value.trim();persistir(`Regra ${k} = ${el.value}`);toast('Regra atualizada');}));
  document.querySelectorAll('[data-dia]').forEach(el=>el.addEventListener('change',()=>{S.regras.diaInicio[el.dataset.dia]=Number(el.value);persistir(`Dia de início ${el.dataset.dia} = ${el.value}`);}));
  document.querySelectorAll('[data-fora]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.fora;S.regras.foraEscopo=el.checked?[...new Set([...S.regras.foraEscopo,k])]:S.regras.foraEscopo.filter(x=>x!==k);persistir(`Escopo: ${REGIME_NOME[k]} ${el.checked?'fora':'dentro'}`);renderNav();}));
}

/* ---------- Drawer ---------- */
function openDrawer(t,b,f){ $('#dTitle').innerHTML=t; $('#dBody').innerHTML=b; $('#dFoot').innerHTML=f||''; $('#drawer').classList.add('on'); $('#overlay').classList.add('on'); }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#overlay').classList.remove('on'); }

/* ---------- Exportações ---------- */
function baixar(nome,conteudo,tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function csv(linhas){ return '﻿'+linhas.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n'); }
/* ---------- Eventos ---------- */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-view],[data-act],[data-emp],[data-fech],[data-onb],[data-doc],[data-mel],[data-sort]');
  if(!t) return;
  if(t.dataset.view) return go(t.dataset.view);
  if(t.dataset.sort){ FC.dir = FC.ord===t.dataset.sort ? -FC.dir : 1; FC.ord=t.dataset.sort; return vClientes(); }
  if(t.dataset.doc){ const s=ciclarDoc(t.dataset.id,t.dataset.doc); t.className='docbtn d-'+s; t.textContent=DOC_ROTULO[s]; renderNav(); return; }
  if(t.dataset.emp) return abrirEmpresa(t.dataset.emp);
  if(t.dataset.fech) return abrirFechamento(t.dataset.fech);
  if(t.dataset.onb) return abrirOnboarding(t.dataset.onb);
  if(t.dataset.mel!==undefined) return abrirMelhoria(Number(t.dataset.mel));
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case 'fechar': return closeDrawer();
    case 'abrir-emp': return abrirEmpresa(id);
    case 'abrir-fech': render(); return abrirFechamento(id);
    case 'abrir-onb': return abrirOnboarding(id);
    case 'termo': return gerarTermo(id);
    case 'copiar-link': { const e=EMP[id]; const lk=linkCliente(e); try{ await navigator.clipboard.writeText(lk); }catch(err){ prompt('Copie o link:',lk); } const o=onb(id); o.linkEnviado=new Date().toISOString(); persistir(`Link de onboarding gerado: ${e.razao}`); toast('Link copiado'); render(); return abrirOnboarding(id); }
    case 'email-link': { const e=EMP[id]; const lk=linkCliente(e); const corpo=`Prezado(a),\n\nSeja bem-vindo(a) à Lucralize Contabilidade.\n\nPara iniciarmos a contabilidade da ${e.razao}, solicitamos o preenchimento do Questionário de Onboarding Contábil no link abaixo. As informações serão utilizadas na parametrização da sua contabilidade e o envio do formulário formaliza o aceite do Termo de Onboarding.\n\n${lk}\n\nPrazo para preenchimento: 5 dias úteis.\n\nAtenciosamente,\nDepartamento Contábil\nLucralize Contabilidade`;
      location.href=`mailto:?subject=${encodeURIComponent('Questionário de Onboarding Contábil — '+e.razao)}&body=${encodeURIComponent(corpo)}`;
      const o=onb(id); o.linkEnviado=new Date().toISOString(); persistir(`Link de onboarding enviado por e-mail: ${e.razao}`); render(); return abrirOnboarding(id); }
    case 'etapa': return mudarEtapa(id,Number(t.dataset.d));
    case 'concluir': return concluir(id);
    case 'proxima': { const f=S.fechamentos[id]; iniciarFechamento(id,addM(f.competencia,1)); persistir(`${EMP[id].razao}: aberta ${fmtC(S.fechamentos[id].competencia)}`); render(); return abrirFechamento(id); }
    case 'cancelar-fech': if(confirm('Encerrar o controle de fechamento desta empresa? O último fechamento informado é mantido.')){ delete S.fechamentos[id]; persistir(`Controle encerrado: ${EMP[id].razao}`); closeDrawer(); render(); } return;
    case 'iniciar-lote': { const el=D.empresas.filter(e=>emEscopo(e)&&!fechAtivo(e.id)&&(ultimoFech(e).ym||(entrada(e)&&!passivo(e).foraMeta))); el.forEach(e=>iniciarFechamento(e.id)); persistir(`${el.length} fechamentos iniciados`); toast(`${el.length} fechamentos iniciados`); return render(); }
    case 'melhoria-de': return abrirMelhoria(null,id);
    case 'nova-melhoria': return abrirMelhoria(null);
    case 'salvar-melhoria': { const m={data:new Date().toISOString().slice(0,10),titulo:$('#mT').value.trim(),descricao:$('#mD').value.trim(),area:$('#mA').value,impacto:$('#mI').value,resp:$('#mR').value,status:$('#mS').value,empresa:$('#mE').value};
      if(!m.titulo){ toast('Informe o título'); return; }
      const i=t.dataset.i; if(i==='') { m.id=uid(); S.melhorias.unshift(m); } else { m.data=S.melhorias[i].data; m.id=S.melhorias[i].id; S.melhorias[i]=m; }
      persistir(`Melhoria: ${m.titulo} (${m.status})`); closeDrawer(); toast('Melhoria registrada'); return render(); }
    case 'excluir-melhoria': if(confirm('Excluir esta melhoria?')){ const [m]=S.melhorias.splice(Number(t.dataset.i),1); persistir(`Melhoria excluída: ${m.titulo}`); closeDrawer(); render(); } return;
    case 'salvar-equipe': S.equipe=$('#eq').value.split('\n').map(s=>s.trim()).filter(Boolean); persistir('Equipe atualizada'); toast('Equipe salva'); return render();
    case 'importar-dados': return $('#fileDados').click();
    case 'exportar-estado': persistir(); return baixar(`portal_estado_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,1),'application/json');
    case 'importar-estado': return $('#fileImport').click();
    case 'csv-clientes': return baixar('clientes_portal_contabil.csv',csv([['ID Acessórias','Razão social','Fantasia','CNPJ/CPF','Regime','Grupo','UF','Cliente desde','Cadastro','Responsável','Último fechamento','Meses em aberto','Fechamento atual','Etapa'],...filtrarClientes().map(({e,p,f})=>[e.id,e.razao,e.fantasia,e.cnpj,REGIME_NOME[e.regime],e.grupo,e.uf,e.desde,e.cadastro,responsavel(e),p.ult,p.ateHoje,f?f.competencia:'',f?ETAPAS[f.etapa]:''])]),'text/csv');
    case 'csv-passivo': return baixar('passivo_contabil.csv',csv([['ID Acessórias','Razão social','CNPJ/CPF','Regime','Responsável','Entrada','Último fechamento',`A realizar até ${S.regras.competenciaMeta}`,'Em aberto hoje','Balancetes atrasados (Acessórias)','Fora da meta'],...D.empresas.filter(emEscopo).map(e=>{const p=passivo(e);return [e.id,e.razao,e.cnpj,REGIME_NOME[e.regime],responsavel(e),e.desde||e.cadastro,p.ult,p.ateMeta,p.ateHoje,p.estimAcess,p.foraMeta?'Sim':'Não'];})]),'text/csv');
  }
});
$('#overlay').addEventListener('click',closeDrawer);
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape') closeDrawer(); });
$('#fileImport').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; if(!f) return; if(_papel==='leitura'){ toast('Seu perfil é somente leitura.','warning'); ev.target.value=''; return; } let txt=await f.text();
  txt=txt.replace(/^[\s\S]*?window\.PORTAL_ESTADO_BASE\s*=\s*/,'').replace(/;\s*$/,'');
  try{ const obj=JSON.parse(txt); if(!obj.versao) throw 0; if(!confirm('Substituir o estado atual pelo arquivo importado?')) return; S=Object.assign(estadoPadrao(),obj); S.regras=Object.assign(estadoPadrao().regras,S.regras||{}); (S.melhorias||[]).forEach(m=>{if(!m.id)m.id=uid();}); persistir(`Estado importado de ${f.name}`); toast('Estado importado: gravando no Supabase'); render(); }
  catch(e){ toast('Arquivo inválido'); }
  ev.target.value='';
});
/* ---------- Inicialização (chamada depois do login) ---------- */
let _bootFeito=false;
function iniciarPortal(){
  const v=(location.hash||'#geral').slice(1); VIEW=viewPermitida(v)?v:'geral';
  if(_papel!=='leitura'){ const n=importarRespostas(); if(n) setTimeout(()=>toast(`${n} questionário(s) de onboarding respondido(s) pelo cliente importado(s)`),400); }
  if(!_bootFeito){
    _bootFeito=true;
    window.addEventListener('hashchange',()=>{const x=location.hash.slice(1); if(x!==VIEW && viewPermitida(x)){VIEW=x;render();}});
    window.addEventListener('beforeunload',ev=>{ if(_syncT||_syncing){ ev.preventDefault(); ev.returnValue=''; } });
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible' && Date.now()-_ultCarga>5*60*1000 && !_syncT && !_syncing && !$('#drawer').classList.contains('on')) recarregar();
    });
  }
  render();
}
async function recarregar(){ try{ await carregarDados(); render(); }catch(e){ toast('Não consegui atualizar os dados: '+e.message,'danger'); } }

document.getElementById('fileDados').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  if(_papel==='leitura'){ toast('Seu perfil é somente leitura.','warning'); return; }
  if(!confirm('Carregar os dados do Acessórias de '+f.name+'? Cadastro, obrigações e solicitações serão atualizados. Os controles da equipe não são alterados.')) return;
  toast('Carregando dados do Acessórias…','info');
  try{ const n=await importarDadosAcessorias(f); await carregarDados(); render(); toast(`Carga concluída: ${n} clientes atualizados`); }
  catch(e){ toast('Erro na carga: '+e.message,'danger'); }
});

trySilentLogin();
</script>
</body></html>
