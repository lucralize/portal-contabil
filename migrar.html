<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migração PortalContabil.xlsx → Supabase</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>body{background:#F5F7F8;font-family:system-ui,sans-serif}.card{border-color:#E3E7EA}#log{white-space:pre-wrap;font-family:monospace;font-size:.8rem;max-height:340px;overflow:auto;background:#0E1428;color:#d7e3ea;padding:12px;border-radius:8px}</style>
</head>
<body>
<div class="container py-4" style="max-width:760px">
  <h4 class="mb-1">Migração da planilha para o Supabase</h4>
  <p class="text-muted small">Página de uso único. Lê o <code>PortalContabil.xlsx</code> baixado do SharePoint e grava no banco, trocando os ids antigos por uuid e ligando empresa/banco por CNPJ/apelido. Só funciona para um usuário <b>admin</b> ou <b>operador</b> logado.</p>

  <div class="card p-3 mb-3" id="boxLogin">
    <div id="loginStatus" class="small mb-2">Verificando login...</div>
    <div class="d-none" id="btnLogin"><input id="mgEmail" type="email" class="form-control form-control-sm mb-2" placeholder="Email"><input id="mgSenha" type="password" class="form-control form-control-sm mb-2" placeholder="Senha" onkeydown="if(event.key==='Enter')entrar()"><button class="btn btn-primary btn-sm" onclick="entrar()">Entrar</button></div>
  </div>

  <div class="card p-3 mb-3 d-none" id="boxFile">
    <label class="form-label fw-semibold">1. Selecione o PortalContabil.xlsx</label>
    <input type="file" class="form-control mb-2" id="fileInp" accept=".xlsx">
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="chkLimpar">
      <label class="form-check-label small" for="chkLimpar">Apagar antes TODOS os dados atuais do banco (empresas, bancos, lançamentos, regras, planos). Use só na carga inicial.</label>
    </div>
    <button class="btn btn-outline-primary btn-sm me-2" id="btnAnalisar" onclick="analisar()">2. Analisar (não grava nada)</button>
    <button class="btn btn-success btn-sm" id="btnMigrar" onclick="migrar()" disabled>3. Migrar</button>
  </div>

  <div class="progress mb-2 d-none" id="progWrap"><div class="progress-bar" id="prog" style="width:0%"></div></div>
  <div id="log" class="d-none"></div>
</div>

<script>
const SB_URL = "https://zllpbyvrfrwyntdyubzv.supabase.co";
const SB_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsbHBieXZyZnJ3eW50ZHl1Ynp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyOTkzOTgsImV4cCI6MjEwODg3NTM5OH0.lUedjoXUR4ZY9-nPfyJMb-hAyMzjAI_YDIKhxkIM4yw";
const sb = supabase.createClient(SB_URL, SB_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce'}});
const uuid = () => crypto.randomUUID();
const $ = id => document.getElementById(id);
let PLAN=null; // resultado da análise

function log(m){ const l=$('log'); l.classList.remove('d-none'); l.textContent+=m+'\n'; l.scrollTop=l.scrollHeight; }
function setProg(p){ $('progWrap').classList.remove('d-none'); $('prog').style.width=p+'%'; }
function chk(res,ctx){ if(res.error) throw new Error(ctx+': '+res.error.message); return res.data; }

async function init(){
  const {data}=await sb.auth.getSession();
  if(!data.session){ $('loginStatus').textContent='Você não está logado.'; $('btnLogin').classList.remove('d-none'); return; }
  const email=(data.session.user.email||'').toLowerCase();
  const {data:u}=await sb.from('usuarios_autorizados').select('papel,ativo').eq('email',email).maybeSingle();
  if(!u||!u.ativo||u.papel==='leitura'){ $('loginStatus').textContent=email+' não tem permissão de escrita.'; return; }
  $('loginStatus').textContent='Logado como '+email+' ('+u.papel+').';
  $('boxFile').classList.remove('d-none');
}
async function entrar(){
  const email=$('mgEmail').value.trim().toLowerCase(), senha=$('mgSenha').value;
  const {error}=await sb.auth.signInWithPassword({email,password:senha});
  if(error){ $('loginStatus').textContent='Email ou senha incorretos.'; return; }
  location.reload();
}

// ---------- leitura da planilha ----------
const S = v => (v===undefined||v===null) ? '' : String(v).trim();
const sim = v => S(v).toLowerCase()==='sim';
function num(v){ if(typeof v==='number') return v; const n=parseFloat(S(v).replace(/\./g,'').replace(',','.')); return isNaN(n)?parseFloat(v):n; }
function isoDate(v){
  if(v===undefined||v===null||v==='') return null;
  if(typeof v==='number'){ return new Date(Math.floor(v-25569)*86400*1000).toISOString().slice(0,10); }
  const t=S(v);
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m) return m[3]+'-'+m[2]+'-'+m[1];
  return null;
}
function sheetRows(wb,name){
  const ws=wb.Sheets[name]; if(!ws) return null;
  const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
  return rows.filter(r=>S(r.Id)!==''||Object.values(r).some(x=>S(x)!==''));
}

async function analisar(){
  const f=$('fileInp').files[0]; if(!f){ alert('Selecione o arquivo.'); return; }
  $('log').textContent=''; PLAN=null; $('btnMigrar').disabled=true;
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const R={}; for(const n of ['Empresas','PlanoContas','Contas','Bancos','Lancamentos','Regras']) R[n]=sheetRows(wb,n);
  for(const n of ['Empresas','PlanoContas','Bancos','Lancamentos','Regras']) if(!R[n]){ log('ERRO: aba "'+n+'" não encontrada.'); return; }
  const avisos=[]; const P={planos:[],contas:[],empresas:[],bancos:[],lancs:[],regras:[],avisos};

  // planos
  const planoPorId=new Map(), planoPorNome=new Map();
  for(const r of R.PlanoContas){
    const nome=S(r.Title); if(!nome||!S(r.Id)) continue;
    if(planoPorNome.has(nome)){ avisos.push('Plano duplicado ignorado: '+nome); planoPorId.set(S(r.Id),planoPorNome.get(nome)); continue; }
    const id=uuid(); planoPorNome.set(nome,id); planoPorId.set(S(r.Id),id);
    P.planos.push({id,nome,descricao:S(r.Descricao)||null});
    // formato antigo: contas dentro da coluna ContasJSON
    if(!R.Contas && S(r.ContasJSON)){ try{ JSON.parse(r.ContasJSON).forEach(c=>P._contasJson=(P._contasJson||[]).concat([{plano:id,c}])); }catch(e){ avisos.push('ContasJSON inválido no plano '+nome); } }
  }
  // contas
  const vistoConta=new Set();
  const addConta=(planoId,c)=>{
    const codigo=S(c.codigo!==undefined?c.codigo:c.Codigo); if(!codigo) return;
    const k=planoId+'|'+codigo; if(vistoConta.has(k)){ avisos.push('Conta repetida ignorada: '+codigo); return; } vistoConta.add(k);
    const nat=S(c.natureza||c.Natureza)||'D';
    P.contas.push({id:uuid(),plano_id:planoId,codigo,nome:S(c.nome||c.Nome)||codigo,tipo:S(c.tipo||c.Tipo),natureza:nat==='C'?'C':'D',
      nivel:Math.min(9,Math.max(1,parseInt(c.nivel||c.Nivel)||4)),aceita:(c.aceita!==undefined?!!c.aceita:sim(c.Aceita)),hp:S(c.hp||c.Hp)||null,ch:parseInt(c.ch||c.Ch)||0});
  };
  if(R.Contas){ for(const r of R.Contas){ const pid=planoPorId.get(S(r.PlanoId)); if(!pid){ avisos.push('Conta sem plano ('+S(r.Codigo)+') ignorada'); continue; } addConta(pid,r); } }
  else (P._contasJson||[]).forEach(x=>addConta(x.plano,x.c));

  // empresas
  const empPorCnpj=new Map(); const empSemCnpj=[];
  for(const r of R.Empresas){
    const nome=S(r.Title); if(!nome||!S(r.Id)) continue;
    const cnpj=S(r.CNPJ);
    if(cnpj && empPorCnpj.has(cnpj)){ avisos.push('CNPJ duplicado ignorado: '+cnpj+' ('+nome+')'); continue; }
    const id=uuid();
    const e={id,nome,razao_social:S(r.Razao)||null,cnpj:cnpj||null,regime:S(r.Regime)||null,plano_id:planoPorNome.get(S(r.Plano))||null,
      data_entrada:isoDate(r.DataEntrada),nova:sim(r.Nova),obs:S(r.Obs)||null,razao_importado:false};
    if(S(r.Plano) && !e.plano_id) avisos.push('Empresa "'+nome+'": plano "'+S(r.Plano)+'" não encontrado');
    P.empresas.push(e); if(cnpj) empPorCnpj.set(cnpj,id); else empSemCnpj.push(id);
  }
  const empId=k=>{ k=S(k); if(k) return empPorCnpj.get(k)||null; return empSemCnpj.length===1?empSemCnpj[0]:null; };

  // bancos
  const bancoKey=new Map();
  for(const r of R.Bancos){
    const eid=empId(r.Empresa); const ap=S(r.Title);
    if(!S(r.Id)||!ap) continue;
    if(!eid){ avisos.push('Banco "'+ap+'" sem empresa (CNPJ '+S(r.Empresa)+') ignorado'); continue; }
    const k=eid+'|'+ap; if(bancoKey.has(k)){ avisos.push('Banco repetido ignorado: '+ap); continue; }
    const id=uuid(); bancoKey.set(k,id);
    P.bancos.push({id,empresa_id:eid,apelido:ap,banco:S(r.Banco)||ap,agencia:S(r.Agencia)||null,conta:S(r.Conta)||null,tipo:S(r.Tipo)||null,
      conta_contabil:S(r.ContaContabil)||null,saldo:num(r.Saldo)||0,data_saldo:isoDate(r.DataSaldo)});
  }
  // lançamentos
  let semEmp=0, valorInv=0, dataInv=0;
  for(const r of R.Lancamentos){
    if(!S(r.Id)) continue;
    const eid=empId(r.Empresa); if(!eid){ semEmp++; continue; }
    const valor=num(r.Valor); if(!(valor>0)){ valorInv++; continue; }
    const data=isoDate(r.Data); if(!data){ dataInv++; continue; }
    const ap=S(r.Banco);
    P.lancs.push({id:uuid(),empresa_id:eid,banco_id:ap?(bancoKey.get(eid+'|'+ap)||null):null,data,conta_d:S(r.ContaD),conta_c:S(r.ContaC),
      valor:Math.round(valor*100)/100,historico:S(r.Historico)||null,cod_historico:S(r.CodHistorico)||null,documento:S(r.Documento)||null,
      origem:S(r.Origem)||null,conciliado:sim(r.Conciliado)});
  }
  if(semEmp) avisos.push(semEmp+' lançamento(s) sem empresa correspondente — ignorados');
  if(valorInv) avisos.push(valorInv+' lançamento(s) com valor zero/negativo/inválido — ignorados');
  if(dataInv) avisos.push(dataInv+' lançamento(s) com data inválida — ignorados');
  // regras
  const regraKey=new Set();
  for(const r of R.Regras){
    const eid=empId(r.Empresa); const pat=S(r.Pattern); if(!S(r.Id)||!pat) continue;
    if(!eid) { avisos.push('Regra "'+pat+'" sem empresa — ignorada'); continue; }
    const k=eid+'|'+pat; if(regraKey.has(k)) continue; regraKey.add(k);
    P.regras.push({id:uuid(),empresa_id:eid,pattern:pat,conta_d:S(r.ContaD),conta_c:S(r.ContaC),historico:S(r.Historico)||null,cod_historico:S(r.CodHistorico)||null});
  }
  PLAN=P;
  log('ANÁLISE (nada foi gravado ainda)');
  log(`Planos: ${P.planos.length} | Contas: ${P.contas.length} | Empresas: ${P.empresas.length} | Bancos: ${P.bancos.length} | Lançamentos: ${P.lancs.length} | Regras: ${P.regras.length}`);
  log(`Linhas lidas na planilha → Planos ${R.PlanoContas.length}, Contas ${R.Contas?R.Contas.length:'(JSON)'}, Empresas ${R.Empresas.length}, Bancos ${R.Bancos.length}, Lançamentos ${R.Lancamentos.length}, Regras ${R.Regras.length}`);
  if(avisos.length){ log('\nAVISOS ('+avisos.length+'):'); avisos.slice(0,60).forEach(a=>log(' - '+a)); if(avisos.length>60) log(' ... e mais '+(avisos.length-60)); }
  else log('Sem avisos.');
  log('\nSe os números estão certos, clique em "3. Migrar".');
  $('btnMigrar').disabled=false;
}

async function inserir(tabela, rows, ini, fim){
  const CH=500;
  for(let i=0;i<rows.length;i+=CH){
    chk(await sb.from(tabela).insert(rows.slice(i,i+CH)), 'Inserir em '+tabela);
    setProg(ini+(fim-ini)*Math.min(i+CH,rows.length)/rows.length);
  }
}

async function migrar(){
  if(!PLAN){ alert('Rode a análise primeiro.'); return; }
  const P=PLAN; $('btnMigrar').disabled=true; $('btnAnalisar').disabled=true;
  try{
    if($('chkLimpar').checked){
      if(!confirm('Isso APAGA tudo que já existe no banco antes de migrar. Continuar?')){ $('btnAnalisar').disabled=false; $('btnMigrar').disabled=false; return; }
      log('Limpando dados atuais...');
      const z='00000000-0000-0000-0000-000000000000';
      chk(await sb.from('empresas').delete().neq('id',z),'Limpar empresas');   // cascata: bancos, lançamentos, regras
      chk(await sb.from('planos_contas').delete().neq('id',z),'Limpar planos'); // cascata: contas
    } else {
      for(const [t,rot] of [['empresas','empresas'],['planos_contas','planos'],['lancamentos','lançamentos']]){
        const {count,error}=await sb.from(t).select('*',{count:'exact',head:true}); if(error) throw new Error(error.message);
        if(count>0){ log(`ABORTADO: já existem ${count} registro(s) em ${rot}. Marque "Apagar antes" se for a carga inicial.`); $('btnAnalisar').disabled=false; return; }
      }
    }
    log('Gravando planos...');       await inserir('planos_contas',P.planos,0,5);
    log('Gravando contas...');       await inserir('contas',P.contas,5,25);
    log('Gravando empresas...');     await inserir('empresas',P.empresas,25,30);
    log('Gravando bancos...');       await inserir('bancos',P.bancos,30,35);
    log('Gravando lançamentos...');  await inserir('lancamentos',P.lancs,35,90);
    log('Gravando regras...');       await inserir('regras',P.regras,90,100);
    log('\nConferindo contagens no banco:');
    let ok=true;
    for(const [t,n] of [['planos_contas',P.planos.length],['contas',P.contas.length],['empresas',P.empresas.length],['bancos',P.bancos.length],['lancamentos',P.lancs.length],['regras',P.regras.length]]){
      const {count}=await sb.from(t).select('*',{count:'exact',head:true});
      log(` ${t}: esperado ${n} / no banco ${count} ${count===n?'✔':'✖'}`); if(count!==n) ok=false;
    }
    let somaBanco=0;
    for(let from=0;;from+=1000){ const d=chk(await sb.from('lancamentos').select('valor').order('id').range(from,from+999),'Somar'); d.forEach(r=>somaBanco+=Number(r.valor)); if(d.length<1000) break; }
    log(` Soma dos valores dos lançamentos: banco ${somaBanco.toFixed(2)} | esperado ${P.lancs.reduce((a,r)=>a+r.valor,0).toFixed(2)}`);
    log(ok?'\nMIGRAÇÃO CONCLUÍDA ✔':'\nMigração terminou com divergências — veja acima.');
  }catch(e){ log('\nERRO: '+e.message+'\nA migração parou. Rode de novo marcando "Apagar antes" para recomeçar limpo.'); $('btnAnalisar').disabled=false; }
}
init();
</script>
</body>
</html>
